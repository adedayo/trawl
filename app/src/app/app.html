<div [class]="theme() === 'dark' ? 'dark min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans' : 'min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans'">
  
  <app-header></app-header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    @if (activeTab() === 'overview') {
      <app-overview></app-overview>
    }
    @if (activeTab() === 'assets') {
      <app-assets></app-assets>
    }
    @if (activeTab() === 'findings') {
      <app-findings></app-findings>
    }
    @if (activeTab() === 'email') {
      <app-email-posture></app-email-posture>
    }
    @if (activeTab() === 'secrets') {
      <app-secrets></app-secrets>
    }
    @if (activeTab() === 'scope') {
      <app-scope></app-scope>
    }
  </main>

  <footer [class]="theme() === 'dark' ? 'border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-500' : 'border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500'">
    Trawl External Exposure Engine • Apache 2.0 Open Source
  </footer>
</div>
