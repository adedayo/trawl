name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # The Go engine is the whole product: the store, the job queue, the ingest
  # server. It ran ungated until now, which is how four files drifted out of
  # gofmt without anyone noticing. This job runs in parallel with the frontend
  # one so neither waits on the other.
  go:
    name: Go — Format, Vet, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # Reported as a diff rather than a bare list of filenames, so the fix is
      # visible in the log instead of requiring a local run to discover.
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l ./pkg ./cmd)" ]; then
            echo "::error::The following files are not gofmt-formatted. Run: gofmt -w ./pkg ./cmd"
            gofmt -d ./pkg ./cmd
            exit 1
          fi
          echo "gofmt: clean"

      - name: Vet
        run: go vet ./pkg/... ./cmd/...

      # ./... is deliberately not used: the root package embeds the built
      # dashboard via go:embed, so building it here would require the Angular
      # build this job intentionally does not depend on. The desktop build is
      # covered by the packaging workflow.
      - name: Build
        run: go build ./pkg/... ./cmd/...

      # -race matters here specifically: the job queue is claimed concurrently
      # by multiple workers, and its exclusivity test spawns goroutines.
      - name: Test
        run: go test -race -count=1 ./pkg/... ./cmd/...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Reports rather than blocks. There is a known reachable advisory with no
      # published fix; failing the build on something no one can act on only
      # teaches people to ignore a red pipeline. Reachability is reviewed via
      # ./security-fix.sh, where it can be knowingly accepted instead.
      - name: Vulnerability reachability report
        continue-on-error: true
        run: govulncheck ./pkg/... ./cmd/...

      # A retraction is the module author stating that the version in use is
      # defective. That is a stronger signal than a routine version bump and is
      # deliberately not subject to the update cooldown: the cooldown exists to
      # let a release prove itself, which is exactly what a retraction has
      # already settled. `modernc.org/libc` v1.74.3 was retracted for a
      # name-resolution deadlock and sat in this tree unnoticed — in a
      # DNS-heavy tool.
      - name: Retracted dependency check
        run: |
          retracted=$(go list -m -retracted -f '{{if .Retracted}}{{.Path}} {{.Version}}{{end}}' all 2>/dev/null | grep . || true)
          if [ -n "$retracted" ]; then
            echo "::error::The module author has retracted these versions:"
            echo "$retracted"
            exit 1
          fi
          echo "retractions: none"

      # Specifications that name a component the engine no longer uses cannot
      # be verified against anything, and drift silently because nothing reads
      # them on a schedule.
      - name: Specification datastore check
        run: ./scripts/check-spec-datastore.sh

      # A change archived with `git mv` while an editor held an unsaved buffer
      # has twice been recreated at its old path, once leaving a zero-byte
      # ledger behind a proposal that went on citing its phases. Both are
      # invisible on inspection and obvious to a reader of the directory.
      - name: Specification ledger check
        run: go run ./cmd/specledger --check

  vulnerabilities:
    name: Dependency Vulnerability Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Both toolchains, in one job, because the question is about the whole
    # dependency set and the answer differs by ecosystem: govulncheck asks what
    # this program calls, npm asks what ends up in the bundle a user runs. Split
    # across two jobs, neither can give the verdict.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Install dependencies
        run: npm ci && npm --prefix app ci

      # Blocks only on vulnerabilities that reach shipped code — a called Go
      # symbol or a package in the production bundle. Build-toolchain advisories
      # and reachable-but-unfixable ones are printed and do not fail the job,
      # for the reason the previous report-only step existed: a pipeline that
      # goes red over something nobody can act on is one people stop reading.
      #
      # The same script backs the pre-push hook, so a contributor who never
      # installed hooks gets the identical verdict here rather than a different
      # one, and a developer is not told two different things about one tree.
      - name: Vulnerability gate
        run: ./scripts/check-vulns.sh

  validate:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        run: npm --prefix app ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      # The dependency gate decides what merges without a human. Its own tests run
      # on every commit, not only on Renovate pull requests, so that a change which
      # weakens the gate is caught in the pull request that makes it.
      - name: Verify Dependency Gate Logic
        run: npm run test:classifier

      - name: Build Dashboard
        run: npm run build

  # The compose stack was migrated off its previous backend without ever being
  # built. This asserts the manifests parse and the server image compiles.
  compose:
    name: Compose Stack — Config & Server Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose manifests
        run: |
          docker compose -f deploy/compose/docker-compose.yml config -q
          docker compose -f deploy/compose/docker-compose.dev.yml config -q

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/compose/Dockerfile.server
          push: false
          load: true
          tags: trawl-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A server that cannot answer /healthz is not deployed, it is merely
      # running. This is the smallest end-to-end proof the image works.
      - name: Smoke-test the server image
        run: |
          docker run -d --name trawl-ci -p 8080:8080 trawl-server:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz > /dev/null; then
              echo "server healthy after ${i}s"
              curl -sf http://127.0.0.1:8080/api/v1/assets
              docker rm -f trawl-ci > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become healthy within 30s"
          docker logs trawl-ci
          docker rm -f trawl-ci > /dev/null
          exit 1

  # Packaging is the one part of this repository whose defects are found by
  # users rather than by CI: the release workflow only runs on tags, so a
  # malformed cask or an nfpm manifest pointing at a renamed binary sits green
  # until someone tries to install it. This runs the cheap subset of those
  # checks on every commit, which is the point at which the change that broke
  # them is still on screen.
  packaging:
    name: Packaging Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate packaging manifests
        run: ./scripts/validate-packaging.sh

      # The workflows themselves are packaging inputs. actionlint catches the
      # class of error that is otherwise only observable by pushing a tag —
      # notably a step-level `env:` referenced from that step's own `if:`,
      # which never matches and therefore silently skips signing.
      - name: Lint workflows
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
