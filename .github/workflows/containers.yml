# Trawl — container image publication.
#
# Five images, not one image with a mode flag. Trawl already has five distinct
# Dockerfiles because the roles have genuinely different dependencies: the
# server is a static Go binary, the dashboard is nginx serving a bundle, and
# the scan worker carries a set of ProjectDiscovery CLIs. Collapsing them would
# mean every operator pulls the scanner toolchain to run the API.
#
# Publishing them separately also lets an operator pin the scan worker without
# pinning the server, which is the pin they actually want: the workers change
# behaviour, the server changes schema.

name: Containers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to GHCR'
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: trawl-server
            context: .
            dockerfile: deploy/compose/Dockerfile.server
          - image: trawl-dashboard
            context: .
            dockerfile: deploy/compose/Dockerfile.dashboard
          - image: trawl-scan-worker
            context: jobs/scan-worker
            dockerfile: jobs/scan-worker/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v0.0.0-dev"
          fi
          {
            echo "version=${VERSION}"
            echo "commit=$(git rev-parse --short=12 HEAD)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Docker tags
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      # QEMU is only needed for the arm64 leg. The scan worker in particular
      # compiles a set of Go CLIs from source, which under emulation is slow
      # enough to be worth knowing about before wondering why the job is.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # An image nobody can enumerate the contents of is an image nobody
          # can tell you is vulnerable. Both are cheap here and neither
          # requires a secret.
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
