# Trawl — continuous EASM stack.
#
# State lives in SQLite inside the trawl-server container, on the named
# `trawl-data` volume. There is no separate database service: the server is
# the ingest target, the job broker, and the read API.
#
# Every service declares both `image:` and `build:`. That is deliberate rather
# than redundant: `docker compose up` pulls the published image, so the default
# path for an operator costs a download instead of a toolchain, while
# `docker compose build` still works unchanged for anyone developing against
# this file. Pin the stack with TRAWL_VERSION; the `latest` default is a
# convenience for evaluation, not a recommendation for a deployment.

services:
  trawl-server:
    image: ghcr.io/adedayo/trawl-server:${TRAWL_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.server
    container_name: trawl-server
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - TRAWL_DB_DSN=/data/trawl.db
      - TRAWL_LISTEN_ADDR=:8080
      - TRAWL_AUTH_TOKEN=${TRAWL_AUTH_TOKEN:-}
    volumes:
      - trawl-data:/data

  dashboard:
    image: ghcr.io/adedayo/trawl-dashboard:${TRAWL_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.dashboard
    container_name: trawl-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - trawl-server

  ofelia:
    # Pinned. This container holds a read-only Docker socket, which makes it
    # the highest-value target in the stack; `latest` on that service means the
    # most privileged component is the one whose contents nobody chose.
    image: mcuadros/ofelia:v0.3.20
    container_name: trawl-ofelia
    restart: unless-stopped
    depends_on:
      - trawl-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia.conf:/etc/ofelia/config.ini:ro

  discovery-worker:
    image: ghcr.io/adedayo/trawl-discovery-worker:${TRAWL_VERSION:-latest}
    build:
      context: ../../jobs/discovery-worker
      dockerfile: Dockerfile
    container_name: trawl-discovery-worker
    profiles: ["workers"]
    depends_on:
      - trawl-server
    environment:
      - TRAWL_INGEST_URL=${TRAWL_INGEST_URL:-http://trawl-server:8080/api/ingest/discovery}
      - TRAWL_AUTH_TOKEN=${TRAWL_AUTH_TOKEN:-}
      - SEED_DOMAINS=${SEED_DOMAINS:-}
      - DRY_RUN=${DRY_RUN:-false}

  scan-worker:
    image: ghcr.io/adedayo/trawl-scan-worker:${TRAWL_VERSION:-latest}
    build:
      context: ../../jobs/scan-worker
      dockerfile: Dockerfile
    container_name: trawl-scan-worker
    profiles: ["workers"]
    depends_on:
      - trawl-server
    environment:
      - TRAWL_INGEST_URL=${TRAWL_SCAN_INGEST_URL:-http://trawl-server:8080/api/ingest/scan}
      - TRAWL_AUTH_TOKEN=${TRAWL_AUTH_TOKEN:-}
      - SEED_DOMAINS=${SEED_DOMAINS:-}
      - SEED_CIDRS=${SEED_CIDRS:-}
      - DRY_RUN=${DRY_RUN:-false}

  repo-scan-worker:
    image: ghcr.io/adedayo/trawl-repo-scan-worker:${TRAWL_VERSION:-latest}
    build:
      context: ../../jobs/repo-scan-worker
      dockerfile: Dockerfile
    container_name: trawl-repo-scan-worker
    profiles: ["workers"]
    depends_on:
      - trawl-server
    environment:
      - TRAWL_INGEST_URL=${TRAWL_SECRETS_INGEST_URL:-http://trawl-server:8080/api/ingest/secrets}
      - TRAWL_AUTH_TOKEN=${TRAWL_AUTH_TOKEN:-}
      - SEED_REPOS=${SEED_REPOS:-}
      - SECRET_VERIFICATION_ENABLED=${SECRET_VERIFICATION_ENABLED:-false}
      - MAX_REPO_CLONE_SIZE_MB=${MAX_REPO_CLONE_SIZE_MB:-500}
      - DRY_RUN=${DRY_RUN:-false}

volumes:
  trawl-data:
