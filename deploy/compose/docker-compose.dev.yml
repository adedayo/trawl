services:
  convex:
    image: node:22
    container_name: trawl-convex-dev
    restart: unless-stopped
    stdin_open: true
    working_dir: /workspace
    ports:
      - "3210:3212"
      - "3211:3213"
    environment:
      - CONVEX_AGENT_MODE=anonymous
      - CI=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../../:/workspace
      - /workspace/node_modules
    command: sh -c "npm install convex && apt-get update && apt-get install -y socat && (socat TCP-LISTEN:3212,fork,bind=$$(hostname -i) TCP:127.0.0.1:3210 &) && (socat TCP-LISTEN:3213,fork,bind=$$(hostname -i) TCP:127.0.0.1:3211 &) && npx convex dev"


  dashboard-dev:
    image: node:22-alpine
    container_name: trawl-dashboard-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ../../app:/app
      - /app/node_modules
      - ../../convex:/convex
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200"
    depends_on:
      - convex

  scan-worker:
    build:
      context: ../../jobs/scan-worker
      dockerfile: Dockerfile
    container_name: trawl-scan-worker-dev
    environment:
      - CONVEX_INGEST_URL=http://convex:3211/api/ingest/scan
      - SEED_DOMAINS=${SEED_DOMAINS:-example.com}
      - DRY_RUN=${DRY_RUN:-false}

  repo-scan-worker:
    build:
      context: ../../jobs/repo-scan-worker
      dockerfile: Dockerfile
    container_name: trawl-repo-scan-worker-dev
    environment:
      - CONVEX_INGEST_URL=http://convex:3211/api/ingest/secrets
      - SEED_REPOS=${SEED_REPOS:-https://github.com/example/repo}
      - DRY_RUN=${DRY_RUN:-false}

volumes:
  convex-data-dev:
