# Trawl — development stack with hot reload.
#
# The Go server runs under `go run` with the source bind-mounted, and the
# Angular dashboard runs `ng serve`. State is a SQLite file on a named volume,
# so restarting the server does not lose the database.

services:
  trawl-server:
    image: golang:1.26-alpine
    container_name: trawl-server-dev
    restart: unless-stopped
    working_dir: /src
    ports:
      - "8081:8080"
    environment:
      - CGO_ENABLED=0
      - TRAWL_DB_DSN=/data/trawl.db
      - TRAWL_LISTEN_ADDR=:8080
      - TRAWL_AUTH_TOKEN=${TRAWL_AUTH_TOKEN:-}
    volumes:
      - ../../:/src
      - trawl-data-dev:/data
      - go-mod-cache:/go/pkg/mod
    command: go run ./cmd/trawl server

  dashboard-dev:
    image: node:24-alpine
    container_name: trawl-dashboard-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ../../app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200"
    depends_on:
      - trawl-server

  scan-worker:
    build:
      context: ../../jobs/scan-worker
      dockerfile: Dockerfile
    container_name: trawl-scan-worker-dev
    depends_on:
      - trawl-server
    environment:
      - TRAWL_INGEST_URL=http://trawl-server:8080/api/ingest/scan
      - TRAWL_AUTH_TOKEN=${TRAWL_AUTH_TOKEN:-}
      - SEED_DOMAINS=${SEED_DOMAINS:-example.com}
      - DRY_RUN=${DRY_RUN:-true}

  repo-scan-worker:
    build:
      context: ../../jobs/repo-scan-worker
      dockerfile: Dockerfile
    container_name: trawl-repo-scan-worker-dev
    depends_on:
      - trawl-server
    environment:
      - TRAWL_INGEST_URL=http://trawl-server:8080/api/ingest/secrets
      - TRAWL_AUTH_TOKEN=${TRAWL_AUTH_TOKEN:-}
      - SEED_REPOS=${SEED_REPOS:-https://github.com/example/repo}
      - DRY_RUN=${DRY_RUN:-true}

volumes:
  trawl-data-dev:
  go-mod-cache:
