# nfpm configuration for the Trawl desktop application.
#
# The .tar.gz is kept for "unpack it anywhere", but a tarball does not declare
# its own dependencies. Trawl links against GTK and WebKit at runtime, so a
# user who unpacks a tarball onto a machine without them gets a linker error
# rather than an install failure with a package name in it. That is what these
# declarations are for.
#
# Rendered by the release workflow with envsubst-style expansion of
# ${VERSION} and ${ARCH}.

name: trawl
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Adedayo Adetoye <3177640+adedayo@users.noreply.github.com>
description: |
  Continuous external attack surface monitoring.
  Trawl discovers internet-facing assets via passive OSINT, scans them
  non-destructively, correlates findings against CISA KEV, NVD and EPSS, and
  assesses email-authentication and DNS delegation posture. It performs no
  exploitation and stays within an operator-declared authorised scope.
vendor: Adedayo Adetoye
homepage: https://github.com/adedayo/trawl
license: Apache-2.0

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# RPM distributions name the same libraries differently. Without this, the
# .rpm either declares dependencies that do not exist on the target or, worse,
# declares none and fails at first launch.
overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1

contents:
  - src: ./build/bin/Trawl
    dst: /usr/bin/trawl
    file_info:
      mode: 0755

  - src: ./packaging/linux/trawl.desktop
    dst: /usr/share/applications/trawl.desktop

  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/trawl.png

  - src: ./LICENSE
    dst: /usr/share/doc/trawl/LICENSE

  - src: ./NOTICE
    dst: /usr/share/doc/trawl/NOTICE
